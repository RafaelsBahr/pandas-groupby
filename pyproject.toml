[project]
name = "pandas-groupby"
version = "0.1.0"
description = "Exercícios de groupby do pandas com a base de preços de produtos Apple (2020-2026)"
readme = "README.md"
authors = [
    { name = "RafaelsBahr", email = "rafaelsedrezbahr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.1.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
