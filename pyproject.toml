[project]
name = "pandas-groupby"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RafaelsBahr", email = "rafaelsedrezbahr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.1.0",
]

[project.scripts]
